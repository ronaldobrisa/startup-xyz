name: Terraform

on:
  pull_request:
    paths:
      - "terraform/**"
      - "lambda/**"
      - ".tflint.hcl"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - "lambda/**"
      - ".tflint.hcl"
      - ".github/workflows/terraform.yml"

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_ENV: demo
  TF_IN_AUTOMATION: "1"

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.8"

      - uses: terraform-linters/setup-tflint@v5

      - name: Terraform fmt
        run: terraform fmt -check -recursive terraform

      - name: Validate bootstrap
        working-directory: terraform/bootstrap
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Validate root
        working-directory: terraform
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: tflint
        working-directory: terraform
        run: |
          tflint --init
          tflint --recursive

  plan:
    name: Plan (${{ github.event_name == 'pull_request' && 'PR' || 'main' }})
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.8"

      - name: Terraform init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.AWS_STATE_BUCKET }}" \
            -backend-config="key=${TF_ENV}/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}"

      # -lock=false: plan e somente leitura e nao pode bloquear um apply local em andamento.
      - name: Terraform plan
        run: |
          set -o pipefail
          terraform plan -no-color -input=false -lock=false \
            -var-file="envs/${TF_ENV}.tfvars" | tee /tmp/plan.txt

      - name: Comentar plano na PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('/tmp/plan.txt', 'utf8').slice(-60000);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `### Terraform plan (\`${process.env.TF_ENV}\`)\n\`\`\`\n${plan}\n\`\`\``,
            });
